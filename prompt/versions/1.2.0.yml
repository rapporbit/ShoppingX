# ShoppingX 提示词版本 1.2.0 —— 假设：**点名了几件不同物件就拆槽，哪怕它们同属一个大类**。
#
# 靶子是种子集 q21_bundle_listed_slots（「旅行三件套：行李箱、旅行收纳袋、洗漱包，总预算 300」）：
# 2026-09-08 对照组实测 planner 返回 bundle_slots=[]、budget_amount=null（slot_mode 却填了 bundle），
# 于是主 Agent 手工派了三路检索、item_picker 没走 bundle 模式，把「总预算 300」当成了单件上限
# （每件 ≤ $41），收尾还说「每类都是独立推荐，不是一套」——P0 预算红线直接破。根因是基线 planner
# 提示词写的是「跨了 2 个以上不同品类时就拆槽 … 单品类需求一律留空」：行李箱 / 收纳袋 / 洗漱包在
# 模型眼里都是「包袋」一个品类，规则字面上就让它留空了。q21 自迁移前基线起一直是 P0 失败，
# 每次判语不同（材质 / 品类 / 预算），但槽位没拆开是它们共同的上游。
#
# 只改 planner_prompt 里那一句，用 __patch__ 锚定（基线其余部分日后修改自动生效）。
# 风险面：单品类多件（「三双袜子」）不能被误拆成槽——A/B 报告的 P0 / P1 要一起看。

base: prompts.yml
notes: planner 拆槽判据从「跨品类」改成「点名了几件不同物件」（同属一个大类也拆），靶子 q21。
overrides:
  planner_prompt:
    __patch__:
      - old: "**bundle_slots（跨品类拆槽）**——本轮要买的东西**跨了 2 个以上不同品类**时就拆槽，拆成 2~6 个，"
        new: "**bundle_slots（拆槽）**——用户点名了 **2 件以上不同的物件**就拆槽（哪怕它们同属一个大类：行李箱 /\n收纳袋 / 洗漱包都是「包袋」，仍是三个槽），拆成 2~6 个，"
      - old: "决定「组成要不要先跟用户确认」。单品类需求（哪怕买多件同类）一律留空 bundle_slots。"
        new: "决定「组成要不要先跟用户确认」。只有**同一种东西买多件**（「三双袜子」「两个同款水杯」）才算单品类，\n留空 bundle_slots。"
