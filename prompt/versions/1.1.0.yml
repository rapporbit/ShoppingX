# ShoppingX 提示词版本 1.1.0 —— 假设：**只给品牌没给型号时，先搜先比、不先澄清**。
#
# 靶子是种子集 q05_price_compare_samsung（「同款 Samsung 手机帮我跨平台比个价」）：基线的
# <workflow> 收尾段写着「说『同款』却从没出现具体型号 → ask_user 一次」，模型照做，于是整轮只有
# planner + ask_user，一件商品都没比，Rubric 总分 0（P1 三条全扣、P2 全 1 分）。用户要的是
# 「比个价」这个动作，型号缺失并不阻碍它——按该品牌热门型号先比出结果、说清按哪几款比的，
# 比停下来反问一句更接近他要的东西。
#
# 只改这一句，用 __patch__ 锚定（其余逐字跟基线，基线日后修改自动生效，见 app/agent/prompts.py）。
# 风险面：q13_underspecified_clarify 这类**真该澄清**的 case 不能被带偏——A/B 报告的 P0 / P1 要
# 一起看，不只看 q05 涨没涨。

base: prompts.yml
notes: 只给品牌没给型号（q05）时先按热门型号搜比并说明口径，不先 ask_user；连品牌都没有才澄清。
overrides:
  system_prompt:
    __patch__:
      - old: "直接搜；仅硬信息确缺且无法默认（如说「同款」却从没出现具体型号）才 ask_user 一次。"
        new: "直接搜。**只给了品牌没给型号**（「同款 Samsung 手机比个价」）不算硬信息缺失——按该品牌\n当前热门型号先搜先比，回复里说明是按哪几款比的、报型号可再精算；仅硬信息确缺且无法默认（连\n品牌 / 品类都没有）才 ask_user 一次。"
