# globex 生产编排（gcjp / shopx.oiuu.de）。与 docker-compose.yml（开发）的三点关键差异：
#
#   1. **不发布任何端口到宿主**。开发版的 "6333:6333" 会绑 0.0.0.0，而 Docker 直接写 iptables、
#      绕过 ufw —— 等于把无鉴权的 Qdrant / OpenSearch / Redis 挂公网。这里服务间只走内部网络，
#      互相用服务名寻址；唯一入口是 Caddy。
#   2. backend / frontend 额外接入 vaultwarden_web（Caddy 所在的既有网络），供 Caddy 反代。
#   3. 全部 restart: unless-stopped，VPS 重启后自动拉起。
#
# 起停：docker compose -f docker/docker-compose.prod.yml --env-file .env up -d

name: globex

# 日志轮转。**不配这个，磁盘迟早被日志打满，然后全站一起挂**——Docker 的 json-file driver 默认
# 无上限，一个话痨容器（OpenSearch 尤其）几周就能写掉几个 G，而 VPS 的盘就那么大。这是自建部署
# 最经典、也最不该发生的死法：不是被攻击，是自己把自己撑死的。
#
# 每个容器最多 3 × 10MB = 30MB，五个容器封顶 150MB。用 YAML 锚点复用，免得漏配某个服务——漏掉的
# 那个恰好就是话痨的概率，从来不低。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    # 必须与打 snapshot 的本地 Qdrant 同版本：snapshot 内嵌 RocksDB 备份，跨大版本恢复会报
    # "failed to restore RocksDB backup: NotFound"。固定版本而非 latest，避免重启即静默升级。
    image: qdrant/qdrant:v1.18.2
    container_name: globex-qdrant
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [internal]

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: globex-opensearch
    restart: unless-stopped
    logging: *default-logging # 它是这里最话痨的一个：慢查询 / GC / 索引日志一刻不停
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true # 无鉴权可接受：不出内部网络，宿主与公网都够不着
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os-data:/usr/share/opensearch/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: globex-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"] # AOF：重启不丢长期偏好
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  # MySQL —— 账户 / 会话归属 / run_holds 的唯一真相（阶段 1 条 7 起 SQLite 不再是合法形态：
  # 起服时会校验 DATABASE_URL，不是 MySQL 直接拒绝启动）。老库搬数见
  # scripts/migrate_sqlite_to_mysql.py，搬完把 .env 的 DATABASE_URL 指到这里。
  mysql:
    image: mysql:8.0
    container_name: globex-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?compose 需要它，写进 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-globex}
      MYSQL_USER: ${MYSQL_USER:-globex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?compose 需要它，写进 .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      # 用 root 密码 ping：库还没建好时应用连上去也是失败，健康判据要比「端口通了」严。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      # aiomysql 是 optional-dependency，不传这个 arg 镜像里就没有驱动。阶段 1 条 7 起 DATABASE_URL
      # 必须是 MySQL，于是「没装驱动」不再是「降级回 SQLite」，而是起服直接失败。
      args:
        UV_EXTRAS: "--extra db"
    image: globex-backend:latest
    container_name: globex-backend
    restart: unless-stopped
    logging: *default-logging
    env_file: [../.env] # 密钥不进镜像、不进 git，只在 VPS 上这一份
    volumes:
      - ../data:/app/data:ro # 品类卡片 / 评测集等只读语料
      - output:/app/output # 每会话产物
      - uploaded:/app/uploaded
      # var/ 仍挂着：搬去 MySQL 之前的那份 SQLite 还在里面（scripts/migrate_sqlite_to_mysql.py
      # 的源），另外分词器缓存等也落这儿。账户真相已在 mysql 服务的 mysql-data 卷上。
      - appdb:/app/var
    depends_on:
      opensearch: { condition: service_healthy }
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
    networks: [internal, vaultwarden_web] # 后者供 Caddy 反代
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # worker —— 跑 AgentLoop 的那一半（backend 只入队，真正的活在这里）。
  # 与 backend **同一个镜像、同一份 .env**，只换 command：两边跑的必须是同一版代码，否则「API 说
  # 有这个字段、worker 那版还没有」这种错会以最难查的形式出现（任务照跑，结果字段缺一块）。
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        UV_EXTRAS: "--extra db" # 与 backend 逐字相同：两边是同一个镜像 tag，参数不一致会互相覆盖
    image: globex-backend:latest
    container_name: globex-worker
    restart: unless-stopped
    logging: *default-logging
    env_file: [../.env]
    command: ["python", "-m", "app.worker"]
    # **三个卷必须与 backend 逐字相同**（阶段 1-4 的硬前提）：产物是 worker 写、API 读——
    # output 里的 summary.md / session.json 由 GET /api/files 与会话恢复读，uploaded 里的参考图
    # 由 image_understand 读。各挂各的卷不会报错，只会让 API 一律 404，表现为「产物莫名其妙没了」。
    # appdb 同理：账户与会话归属是两个进程共用的真相（SQLite 单文件，MySQL 迁移见阶段 1 条 9）。
    volumes:
      - ../data:/app/data:ro
      - output:/app/output
      - uploaded:/app/uploaded
      - appdb:/app/var
    depends_on:
      opensearch: { condition: service_healthy }
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
    networks: [internal] # 不接 Caddy 网络：它不收 HTTP 请求，只从 Redis Stream 领任务
    # 关停宽限必须 > WORKER_GRACE_SECONDS（默认 330）+ 收尾余量，否则 compose 的默认 10s 会让
    # SIGKILL 抢在收尾前面——应用侧那套 interrupted 收尾一步都跑不了（同 k8s 的三个数，见
    # deploy/k8s/50-worker.yaml）。
    stop_grace_period: 360s

  frontend:
    image: nginx:alpine # 仿 interview-site：静态托管 vite build 产物，Caddy 反代它
    container_name: globex-frontend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [vaultwarden_web]

networks:
  internal: # 仅本 compose 内部，不与 Caddy 网络互通
  vaultwarden_web:
    external: true

volumes:
  mysql-data: # 账户 / 会话归属 / holds：丢了没法从别处重建
  qdrant-data:
  qdrant-snapshots:
  os-data:
  redis-data:
  output:
  uploaded:
  appdb: # 搬去 MySQL 之前的那份 SQLite + 本地缓存（账户真相现在在 mysql-data）
